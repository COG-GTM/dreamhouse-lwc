<template>
    <lightning-card title={cardTitle} icon-name="standard:quotes">
        <div class="slds-var-p-horizontal_medium">
            <template lwc:if={errorMessage}>
                <div class="slds-text-color_error slds-var-m-bottom_small">
                    {errorMessage}
                </div>
            </template>
            <template lwc:if={showClosedMessage}>
                <p
                    class="closed-message slds-text-color_weak slds-var-m-bottom_small"
                >
                    {closedMessage}
                </p>
            </template>
            <template lwc:if={acceptingOffers}>
                <div class="offer-form slds-var-m-bottom_medium">
                    <lightning-input
                        label="Buyer name"
                        value={buyerName}
                        onchange={handleBuyerChange}
                        max-length="120"
                    ></lightning-input>
                    <lightning-input
                        type="number"
                        label="Offer amount"
                        formatter="currency"
                        step="0.01"
                        min="0.01"
                        value={amount}
                        onchange={handleAmountChange}
                    ></lightning-input>
                    <template lwc:if={hasPreview}>
                        <p class={previewClass} data-id="preview">
                            <template lwc:if={previewNeedsApproval}>
                                <lightning-icon
                                    icon-name="utility:warning"
                                    size="xx-small"
                                    variant="error"
                                    alternative-text="Needs approval"
                                    class="slds-var-m-right_xx-small"
                                ></lightning-icon>
                            </template>
                            {previewText}
                        </p>
                    </template>
                    <lightning-button
                        class="slds-var-m-top_small"
                        variant="brand"
                        label="Submit offer"
                        onclick={handleSubmit}
                        disabled={submitDisabled}
                    ></lightning-button>
                </div>
            </template>
            <template lwc:if={hasOffers}>
                <ul class="slds-has-dividers_top-space">
                    <template for:each={offers} for:item="offer">
                        <li
                            key={offer.Id}
                            class="offer slds-item"
                            data-id={offer.Id}
                        >
                            <div class="slds-grid slds-grid_align-spread">
                                <div>
                                    <p class="slds-text-title_bold">
                                        {offer.Buyer_Name__c}
                                    </p>
                                    <p>
                                        <lightning-formatted-number
                                            value={offer.Amount__c}
                                            format-style="currency"
                                            currency-code="USD"
                                            minimum-fraction-digits="2"
                                            maximum-fraction-digits="2"
                                        ></lightning-formatted-number>
                                    </p>
                                    <p
                                        class="slds-text-body_small slds-text-color_weak"
                                    >
                                        {offer.percentLabel}
                                    </p>
                                </div>
                                <div>
                                    <span class={offer.badgeClass}>
                                        {offer.Status__c}
                                    </span>
                                </div>
                            </div>
                            <div class="slds-var-m-top_x-small">
                                <template lwc:if={offer.showApprove}>
                                    <lightning-button
                                        label="Approve"
                                        title={offer.approveTitle}
                                        data-action="approve"
                                        data-id={offer.Id}
                                        onclick={handleAction}
                                        disabled={isBusy}
                                        class="slds-var-m-right_x-small"
                                    ></lightning-button>
                                </template>
                                <template lwc:if={offer.showAccept}>
                                    <lightning-button
                                        variant="success"
                                        label="Accept"
                                        title={offer.acceptTitle}
                                        data-action="accept"
                                        data-id={offer.Id}
                                        onclick={handleAction}
                                        disabled={isBusy}
                                        class="slds-var-m-right_x-small"
                                    ></lightning-button>
                                </template>
                                <template lwc:if={offer.showReject}>
                                    <lightning-button
                                        variant="destructive-text"
                                        label="Reject"
                                        title={offer.rejectTitle}
                                        data-action="reject"
                                        data-id={offer.Id}
                                        onclick={handleAction}
                                        disabled={isBusy}
                                    ></lightning-button>
                                </template>
                            </div>
                        </li>
                    </template>
                </ul>
            </template>
            <template lwc:else>
                <p class="empty slds-text-color_weak slds-var-p-vertical_small">
                    No offers yet.
                </p>
            </template>
        </div>
    </lightning-card>
</template>
