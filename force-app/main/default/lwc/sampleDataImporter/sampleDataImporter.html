<template>
    <lightning-card
        title="Sample Data Import"
        icon-name="standard:product_transfer"
    >
        <div class="slds-var-m-around_medium">
            <p class="slds-var-m-bottom_small">
                Click the button below to add the sample Property, Broker and
                Contact records. Sample records that already exist are skipped;
                existing records are never modified or deleted.
            </p>
            <lightning-button
                label="Import Data"
                variant="brand"
                onclick={handleImportSampleData}
            ></lightning-button>
        </div>
    </lightning-card>
</template>
