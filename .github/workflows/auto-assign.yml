name: Issue assignment

on:
    issues:
        types: [opened]

# Least-privilege default for GITHUB_TOKEN; jobs that need more declare it.
permissions:
    contents: read

jobs:
    # Off by default: opt in with the repository variable ENABLE_REPO_AUTOMATION.
    auto-assign:
        runs-on: ubuntu-latest
        if: vars.ENABLE_REPO_AUTOMATION == 'true' && vars.DEFAULT_ISSUE_ASSIGNEE != ''
        permissions:
            issues: write
        steps:
            - name: 'Auto-assign issue'
              uses: pozil/auto-assign-issue@v4.0.1
              with:
                  repo-token: ${{ secrets.GITHUB_TOKEN }}
                  assignees: ${{ vars.DEFAULT_ISSUE_ASSIGNEE }}
