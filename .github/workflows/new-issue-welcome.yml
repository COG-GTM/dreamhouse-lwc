name: New issue greeting

on:
    issues:
        types: [opened]

# Least-privilege default for GITHUB_TOKEN; jobs that need more declare it.
permissions:
    contents: read

jobs:
    # Off by default: opt in with the repository variable ENABLE_REPO_AUTOMATION.
    comment:
        runs-on: ubuntu-latest
        if: vars.ENABLE_REPO_AUTOMATION == 'true'
        permissions:
            issues: write
        steps:
            - uses: actions/github-script@v9.0.0
              with:
                  script: |
                      await github.rest.issues.createComment({
                        issue_number: context.issue.number,
                        owner: context.repo.owner,
                        repo: context.repo.repo,
                        body: 'Thank you for posting this issue. 🙇🏼‍♂️<br/>We will come back to you shortly.'
                      })
